# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Latest blog post workflow
"on":
  schedule: # Run workflow automatically
    # This will make it run every hour at the top of the hour
    - cron: '0 * * * *'
  # Run workflow manually (without waiting for the cron to be called), through the Github Actions Workflow page directly
  workflow_dispatch:

permissions:
  contents: write

env:
  COMMITTER_USERNAME: blog-post-bot
  COMMITTER_EMAIL: blog-post-bot@example.com
  COMMIT_MESSAGE: Updated with the latest blog posts

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update README with blog posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          # Use only the atom.xml feed (most comprehensive with 79 posts)
          feed_list: "https://solrevdev.com/atom.xml"
          max_post_count: "10"
          template: "$newline- [$title]($url)"
          commit_message: ${{ env.COMMIT_MESSAGE }}
          committer_username: ${{ env.COMMITTER_USERNAME }}
          committer_email: ${{ env.COMMITTER_EMAIL }}
          # Retry the feed fetch instead of failing the run on a transient error
          retry_count: "3"
          retry_wait_time: "10"
          # The action writes the README but does not push it. The step below
          # pushes with a retry, because the action's own push has none and a
          # transient 503 from GitHub fails the whole run.
          skip_commit: "true"
      - name: Commit and push README
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged, nothing to commit"
            exit 0
          fi

          git config user.name "$COMMITTER_USERNAME"
          git config user.email "$COMMITTER_EMAIL"
          git add README.md
          git commit -m "$COMMIT_MESSAGE"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
            git pull --rebase || true
          done

          echo "Push failed after 5 attempts"
          exit 1
